[project]
name = "school-portal-backend"
version = "0.1.0"
description = "Backend for School Portal"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "python-dotenv",
    "pyjwt",
    "pwdlib[argon2]",
    "email-validator",
]

[dependency-groups]
dev = [
    "pytest",
]